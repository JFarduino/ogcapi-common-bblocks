# A short, descriptive name of this building block collection
name: OGC API - Common Building Blocks

# Short abstract for this collection (optional)
abstract: |
  Building Blocks for OGC API - Common: the reusable schemas and OpenAPI components, together
  with the requirements classes, clauses and annexes from which the standards documents are
  generated. Currently Part 1: Core (OGC 19-072, version 1.0.0).

# Description for this collection (optional)
description: |
  OGC API - Common is a multi-part standard that documents the set of common practices and
  shared requirements that have emerged from the development of Resource Oriented Architectures
  and Web APIs within the OGC. Standards developers will use these building-blocks in the
  construction of other OGC Standards that relate to Web APIs. The result is a modular suite
  of coherent API standards which can be adapted by a system designer for the unique requirements
  of their system. As such, this OGC API Standard serves as the "OWS Common" standard for
  resource-oriented OGC APIs.

  This register brings together, with their full history, the technical and normative Building
  Blocks of OGC API - Common that were previously in two repositories:

  - ogcincubator/bblocks-ogcapi-common: Part 1 schemas, paths, responses and the API definition
  - JFarduino/ogcapi-common-standards-as-bblocks: preface, clauses, requirements classes, annexes
    and test resources of [OGC API - Common - Part 1: Core](https://docs.ogc.org/is/19-072/19-072.html)
    (OGC 19-072), from which the standards document is generated by
    [bblocks-specgen](https://github.com/ogcincubator/bblocks-specgen) (see `standards.yaml`)

# Prefix prepended to the path of the building blocks. Each part has its own namespace segment:
#   _sources/part1/schemas/link/          -> ogc.api.common.part1.schemas.link
#   _sources/part1/requirements/core/     -> ogc.api.common.part1.requirements.core
# The identifiers are those of the two former registers, unchanged.
identifier-prefix: ogc.api.common.

# List of imports ("default" is an alias for the main OGC Building Blocks Register).
# Deliberately empty: the Part 1 components that the standards document used to import
# (@ogc/ogcapi-common) are now local, and no block here depends on OGC Main. OGC Main imports
# @ogc/ogcapi-common, so importing it back would create a circular dependency.
# Must stay explicit - omitting 'imports' falls back to importing OGC Main.
imports: []

# Build plugins: generate the standards document(s) described in standards.yaml
# (bblocks-specgen). The document is written to <build-dir>/<standard id>/index.html,
# i.e. build/standards/part1/index.html.
#
# specgen is installed from the feature/update branch of JFarduino/bblocks-specgen ('layout: ogc',
# file includes), locally (build.sh) and in the GitHub workflow alike. To try changes of the local
# copy in bblocks-specgen-jules/ before pushing them, use instead (build.sh mounts the repository
# on /workspace; GitHub workflows cannot see that folder):
#   bblocks-specgen @ file:///workspace/bblocks-specgen-jules
plugins:
  build:
    - classes: [standard_gen.plugin.SpecgenBuildPlugin]
      pip: [bblocks-specgen @ git+https://github.com/JFarduino/bblocks-specgen@feature/update]
      url: https://github.com/JFarduino/bblocks-specgen
      config:
        standards-file: standards.yaml
        build-dir: build/standards

# Meta-registry used to resolve "@org/register" import aliases above (optional).
# Defaults to the postprocessor's built-in meta-registry if omitted; set to null to disable
# alias resolution entirely (any "@org/register" import will then fail).
#
# meta-registry: https://w3id.org/ogc/bblocks/meta-register.json

# Whether to enable the (highly experimental) downcompiling of JSON schemas to an OpenAPI 3.0-compatible
# version
schema-oas30-downcompile: False

# Default license for this register and all of its building blocks (optional).
# At least one of "name"/"url" is required. A building block can override this by declaring its own
# "license" in its bblock.json.
# If "url" is left unspecified and a LICENSE, LICENSE.md or LICENSE.txt file exists at the repository
# root, its published URL is used automatically.
#
license:
  name: OGC License Agreement
  url: https://www.ogc.org/license

# Viewer configuration (optional)
#
# viewer:
#   show-imported-depth: 0  # Controls which imported building blocks are shown in the viewer.
#                           #   0 (default): only local building blocks
#                           #   N (positive integer): local + imported up to N levels deep
#                           #   -1 (any negative number): show all imported building blocks
#                           # This setting is written to register.json and used by the viewer
#                           # whether it is deployed via GitHub Pages or run locally against
#                           # the register. It takes precedence over the viewer_show_imported
#                           # GitHub workflow input (which is now deprecated).
#   view-plugins:           # Client-side view plugins for the viewer (optional)
#     - url: https://example.com/my-view-plugin.js  # ESM module, loaded at runtime via import()
#       export: MyView                              # Optional: named export(s) to use (string or array; defaults to the default export)
#       weight: 10                                   # Optional: controls tab ordering relative to other view plugins
#   tab-plugins:            # Client-side tab plugins for the viewer (optional)
#     - url: https://example.com/my-tab-plugin.js   # ESM module, loaded at runtime via import(); renders a whole new top-level tab
#       export: MyTab                               # Optional: named export(s) to use (string or array; defaults to the default export)
#       weight: 10                                   # Optional: controls tab ordering relative to other tab plugins

# Deployment configuration (optional)
#
# deploy:
#   mode: artifact          # "artifact" (default): build/ is committed to the source branch and deployed to
#                           #   GitHub Pages through GitHub Actions (Pages "Source" = "GitHub Actions")
#                           # "branch": the site is published to a separate branch and build/ is not committed
#                           #   to the source branch. The first run creates the branch; afterwards set Pages
#                           #   "Source" to "Deploy from a branch" (that branch, "/ (root)")
#   branch: gh-pages        # Only used in "branch" mode (default: gh-pages)

# SPARQL configuration (optional)
#   Authentication can be set through the sparql_username and sparql_password GitHub Workflow inputs
#   (see .github/workflow/process-bblocks.yml)
#
# sparql:
#   push: https://example.com/gsp           # SPARQL Graph Store Protocol endpoint for uploading data
#   graph: https://my.bblocks.example.com/  # SPARQL Graph where data will be uploaded
#                                           #  if left empty, the base URL for the publication will be used
#   query: https://example.com/sparql       # SPARQL query endpoint where data will be available
#   resources:                              # Additional resources to upload apart from building block metadata
#      ontologies: true                     #   Whether to upload ontology files to the triplestore

# SHACL validation settings (optional)
#
# shacl:
#   allow-warnings: true    # If true (the default), SHACL results with sh:Warning or sh:Info severity are shown
#                           #  in the validation reports (marked as warnings) but do not fail the building block;
#                           #  only sh:Violation results fail it. Set to false to make any result fail.
#                           #  Note: a "-fail" test that only triggers warnings will then be reported as failed.

# External transformer/validator plugins (optional)
#   Each entry installs its pip dependencies into a sandbox and imports the given modules,
#   which are scanned for plugin classes. Unless the postprocessor is run with
#   --skip-permissions=true, you will be prompted before plugin code is installed/run.
#   NOTE: this repository already declares "plugins" (bblocks-specgen) near the top of this file;
#   add any further plugin entries there rather than uncommenting this reference block.
#
# plugins:
#   transforms:
#     - modules: [my.custom.Transformer]     # Dotted Python module path(s) to import
#       pip: [my-custom-package]             # pip install specifier(s) for the module(s)
#       url: https://example.com/my-plugin   # Optional: plugin homepage/repo (auto-derived from pip if omitted)
#   validators:
#     - modules: [my.custom.Validator]
#       pip: [my-custom-package]
#   build:                                   # Lifecycle-hook plugins (before_run, before/after_bblock,
#                                             #   after_register, after_uplift, after_run, on_error),
#                                             #   run locally and in CI alike.
#     - classes: [my.custom.BuildHooks]      # Fully-qualified module.ClassName(s) - used exactly as
#                                             #   given, not scanned like transforms/validators' "modules"
#       pip: [my-custom-package]
#       url: https://example.com/my-plugin
#       id: strict                           # Optional: [A-Za-z0-9_-]+; lets the same class be declared more
#                                             #   than once (each (class, id) must be unique); passed to the
#                                             #   plugin as context['pluginId']
#       config:                              # Optional: JSON-serializable mapping, passed to the constructor of
#         threshold: 3                       #   every class in this entry. Not published in register.json.
#                                             #   Do not put secrets here - this file is committed to git.