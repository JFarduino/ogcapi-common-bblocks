title: Exception Schema
description: JSON schema for exceptions based on RFC 7807
type: object
required:
- type
properties:
  type:
    type: string
    x-jsonld-id: '@type'
  title:
    type: string
    x-jsonld-id: http://purl.org/dc/terms/title
  status:
    type: integer
    x-jsonld-id: http://www.w3.org/2011/http#statusCodeNumber
  detail:
    type: string
    x-jsonld-id: http://purl.org/dc/terms/description
  instance:
    type: string
    x-jsonld-id: '@id'
x-jsonld-prefixes:
  dct: http://purl.org/dc/terms/
  httpv: http://www.w3.org/2011/http#
x-bblocks-metadata:
  itemIdentifier: ogc.api.common.part1.schemas.exception
  register: https://jfarduino.github.io/ogcapi-common-bblocks/build/register.json
  version: '0.1'
  dateOfLastChange: '2025-10-23'
